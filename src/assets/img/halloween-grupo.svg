<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Grupo de amigos disfrazados de Halloween celebrando en una noche de fiesta">
  <defs>
    <linearGradient id="hsky" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#12052c"/>
      <stop offset="0.5" stop-color="#2a0f5c"/>
      <stop offset="1" stop-color="#5c2a10"/>
    </linearGradient>
    <radialGradient id="hmoon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.50"/>
      <stop offset="0.45" stop-color="#ffd23f" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffd23f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0320"/>
      <stop offset="1" stop-color="#1c0840"/>
    </linearGradient>
    <linearGradient id="hpump" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9d2e"/>
      <stop offset="1" stop-color="#c2560a"/>
    </linearGradient>
  </defs>

  <!-- Cielo nocturno -->
  <rect width="1200" height="800" fill="url(#hsky)"/>

  <!-- Estrellas -->
  <g fill="#ffe9a8">
    <circle cx="120" cy="90" r="2.2" opacity=".85"/>
    <circle cx="250" cy="160" r="1.5" opacity=".6"/>
    <circle cx="380" cy="70" r="1.8" opacity=".7"/>
    <circle cx="520" cy="140" r="1.3" opacity=".5"/>
    <circle cx="640" cy="60" r="2" opacity=".75"/>
    <circle cx="200" cy="300" r="1.4" opacity=".45"/>
    <circle cx="430" cy="250" r="1.6" opacity=".5"/>
    <circle cx="90" cy="220" r="1.3" opacity=".4"/>
    <circle cx="700" cy="180" r="1.5" opacity=".5"/>
    <circle cx="560" cy="330" r="1.2" opacity=".35"/>
  </g>

  <!-- Luna llena con halo -->
  <circle cx="960" cy="200" r="230" fill="url(#hmoon)"/>
  <circle cx="960" cy="200" r="86" fill="#ffe9a8" opacity=".92"/>
  <circle cx="932" cy="176" r="12" fill="#e8cf90" opacity=".45"/>
  <circle cx="985" cy="222" r="8" fill="#e8cf90" opacity=".35"/>
  <circle cx="948" cy="236" r="5" fill="#e8cf90" opacity=".3"/>

  <!-- Murciélagos -->
  <g fill="#0f0324">
    <path d="M300 150c14-11 22-6 27 2 5-8 13-13 27-2-9 1-14 6-16 13-7-5-15-5-22 0-2-7-7-12-16-13z"/>
    <path d="M470 105c10-8 16-4 19 1 4-6 9-9 19-1-6 1-10 4-11 9-5-4-11-4-16 0-1-5-4-8-11-9z"/>
    <path d="M190 265c9-7 14-4 17 1 3-5 8-8 17-1-6 1-9 4-10 8-4-3-9-3-14 0-1-4-4-7-10-8z"/>
  </g>

  <!-- Suelo -->
  <path d="M0 690c160-22 320-22 480-6s320 22 720-4v120H0z" fill="url(#hground)"/>

  <!-- Calabazas iluminadas -->
  <g>
    <g transform="translate(120 660)">
      <path d="M0 30c0-18 14-30 34-30s34 12 34 30-14 26-34 26S0 48 0 30z" fill="url(#hpump)"/>
      <path d="M31 0h7l-2 8h-7z" fill="#3f6b2a"/>
      <path d="M18 24l8-6 8 6-8 5z" fill="#2a0f5c"/>
      <path d="M42 24l8-6 8 6-8 5z" fill="#2a0f5c"/>
      <path d="M17 38q17 13 34 0-6 9-17 9t-17-9z" fill="#2a0f5c"/>
    </g>
    <g transform="translate(1090 650) scale(.85)">
      <path d="M0 30c0-18 14-30 34-30s34 12 34 30-14 26-34 26S0 48 0 30z" fill="url(#hpump)"/>
      <path d="M31 0h7l-2 8h-7z" fill="#3f6b2a"/>
      <path d="M18 24l8-6 8 6-8 5z" fill="#2a0f5c"/>
      <path d="M42 24l8-6 8 6-8 5z" fill="#2a0f5c"/>
      <path d="M17 38q17 13 34 0-6 9-17 9t-17-9z" fill="#2a0f5c"/>
    </g>
  </g>

  <!-- ══ GRUPO DE AMIGOS DISFRAZADOS (siluetas) ══ -->
  <g fill="#0b0220" opacity=".96">

    <!-- Bruja con escoba, brazos arriba -->
    <g transform="translate(690 430)">
      <path d="M60 0l34 62H26z"/>
      <ellipse cx="60" cy="64" rx="52" ry="10"/>
      <circle cx="60" cy="84" r="20"/>
      <path d="M60 100c22 0 34 14 38 34l14 74H8l14-74c4-20 16-34 38-34z"/>
      <path d="M30 120L2 150l10 12 26-26z"/>
      <path d="M90 120l30-26 11 11-30 30z"/>
      <rect x="42" y="204" width="13" height="52" rx="6"/>
      <rect x="65" y="204" width="13" height="52" rx="6"/>
      <path d="M118 62h9v210h-9z" transform="rotate(18 122 160)"/>
      <path d="M136 60l26-12 8 18-28 12z"/>
    </g>

    <!-- Fantasma contento con brazos en alto -->
    <g transform="translate(860 448)">
      <path d="M52 0c30 0 48 26 48 60v96l-16-14-16 14-16-14-16 14-16-14-16 14V60C4 26 22 0 52 0z"/>
      <circle cx="36" cy="48" r="7" fill="#0b0220"/>
      <circle cx="68" cy="48" r="7" fill="#0b0220"/>
      <path d="M40 70q12 12 24 0" stroke="#0b0220" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M4 96l-26-22 10-12 30 20z"/>
      <path d="M100 96l26-22-10-12-30 20z"/>
    </g>

    <!-- Vampiro con capa abierta -->
    <g transform="translate(990 424)">
      <path d="M46 0a22 22 0 1 1 0 44 22 22 0 0 1 0-44z"/>
      <path d="M46 46c20 0 30 12 33 30l10 60H3l10-60c3-18 13-30 33-30z"/>
      <path d="M14 74C-14 96-24 150-14 202c22-16 44-24 60-24s38 8 60 24c10-52 0-106-28-128-14 16-22 24-32 24s-18-8-32-24z"/>
      <path d="M30 238h13v58H30zM49 238h13v58H49z"/>
    </g>

    <!-- Persona con orejas de gato, brazos en V -->
    <g transform="translate(1130 452)">
      <circle cx="40" cy="30" r="21"/>
      <path d="M22 18L14-6l22 12zM58 18L66-6 44 6z"/>
      <path d="M40 52c18 0 28 12 31 28l9 52H0l9-52c3-16 13-28 31-28z"/>
      <path d="M12 76L-14 40l11-9 28 34z"/>
      <path d="M68 76L94 40l-11-9-28 34z"/>
      <rect x="24" y="130" width="12" height="46" rx="6"/>
      <rect x="44" y="130" width="12" height="46" rx="6"/>
    </g>
  </g>

  <!-- Brillo cálido de las calabazas sobre el grupo -->
  <ellipse cx="900" cy="700" rx="330" ry="34" fill="#ff9d2e" opacity=".14"/>
</svg>
